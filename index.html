<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Location Tracking - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      body {
        background: #f4f7fb;
        font-family: Arial, sans-serif;
        color: #172033;
      }
      .navbar {
        background: #173b68;
      }
      .main-card {
        border: 0;
        border-radius: 16px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.05);
      }
      .stat-card {
        border: 0;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
      }
      .stat-number {
        font-size: 28px;
        font-weight: 700;
      }
      .btn-primary {
        background: #2563eb;
        border-color: #2563eb;
      }
      .table th {
        background: #f8fafc;
        white-space: nowrap;
      }
      .status-online {
        color: #16a34a;
        font-weight: 600;
      }
      .status-offline {
        color: #dc2626;
        font-weight: 600;
      }
      .link-box {
        background: #eff6ff;
        border-radius: 10px;
        padding: 15px;
        word-break: break-all;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark py-3">
      <div class="container">
        <span class="navbar-brand fw-bold"> 📍 Live Location Tracking </span>
        <span class="text-white small">Admin Panel</span>
      </div>
    </nav>

    <div class="container py-4">
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card stat-card p-3">
            <div class="text-secondary">Total Users</div>
            <div class="stat-number" id="totalUsers">0</div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card stat-card p-3">
            <div class="text-secondary">Online Users</div>
            <div class="stat-number text-success" id="onlineUsers">0</div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card stat-card p-3">
            <div class="text-secondary">Offline Users</div>
            <div class="stat-number text-danger" id="offlineUsers">0</div>
          </div>
        </div>
      </div>

      <div class="card main-card p-4 mb-4">
        <h5 class="fw-bold mb-3">Create Tracking Link</h5>

        <form id="createForm">
          <div class="row g-2">
            <div class="col-md-9">
              <input type="text" id="userName" class="form-control form-control-lg" placeholder="Enter user name" required />
            </div>

            <div class="col-md-3">
              <button type="submit" class="btn btn-primary btn-lg w-100" id="createBtn">Create Link</button>
            </div>
          </div>
        </form>

        <div id="message" class="mt-3"></div>

        <div id="generatedBox" class="mt-3 d-none">
          <h6 class="fw-bold">Tracking Link Created</h6>

          <div class="link-box">
            <div id="generatedLink"></div>

            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-primary btn-sm" onclick="copyLink()">Copy Link</button>

              <button class="btn btn-success btn-sm" onclick="shareWhatsApp()">WhatsApp</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card main-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">All Users</h5>

          <button class="btn btn-outline-primary btn-sm" onclick="loadUsers()">↻ Refresh</button>
        </div>

        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>User ID</th>
                <th>Name</th>
                <th>Status</th>
                <th>Last Seen</th>
                <th>Location</th>
              </tr>
            </thead>

            <tbody id="usersTable">
              <tr>
                <td colspan="5" class="text-center text-secondary">Loading users...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbyfUqDl4uG9YtpLvjlchI9lT1bCFwq1KNFgFn_ksZT2LEiwP5NMJPZR70ACtO1btMdT7A/exec";

      let latestLink = "";

      function showMessage(message, type = "success") {
        document.getElementById("message").innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      }

      // API request using JSONP
      function apiRequest(action, params = {}) {
        return new Promise((resolve, reject) => {
          const callbackName = "callback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);

          const script = document.createElement("script");
          const query = new URLSearchParams({
            action: action,
            callback: callbackName,
            ...params,
          });

          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("API response timeout. Check deployment and access."));
          }, 20000);

          function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
          }

          window[callbackName] = function (data) {
            cleanup();

            if (!data || data.ok === false) {
              reject(new Error(data?.error || "API request failed"));
              return;
            }

            resolve(data);
          };

          script.onerror = function () {
            cleanup();
            reject(new Error("Google Apps Script connection failed"));
          };

          script.src = API_URL + "?" + query.toString();
          document.body.appendChild(script);
        });
      }

      // Create user
      document.getElementById("createForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const name = document.getElementById("userName").value.trim();
        const button = document.getElementById("createBtn");

        if (!name) return;

        button.disabled = true;
        button.innerText = "Creating...";

        document.getElementById("generatedBox").classList.add("d-none");
        document.getElementById("message").innerHTML = "";

        try {
          const result = await apiRequest("createUser", { name: name });

          latestLink = result.link;

          document.getElementById("generatedLink").innerText = latestLink;
          document.getElementById("generatedBox").classList.remove("d-none");

          showMessage("User successfully saved to Google Sheet!");

          document.getElementById("userName").value = "";

          loadUsers();
        } catch (error) {
          showMessage("NOT SAVED: " + error.message, "danger");
        } finally {
          button.disabled = false;
          button.innerText = "Create Link";
        }
      });

      // Load users
      async function loadUsers() {
        const tbody = document.getElementById("usersTable");

        tbody.innerHTML = `
        <tr>
            <td colspan="5" class="text-center">Loading...</td>
        </tr>`;

        try {
          const result = await apiRequest("getUsers");

          const users = result.users || [];

          document.getElementById("totalUsers").innerText = result.totalUsers ?? users.length;

          document.getElementById("onlineUsers").innerText = result.onlineUsers ?? 0;

          document.getElementById("offlineUsers").innerText = result.offlineUsers ?? 0;

          if (users.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-secondary">
                        No users found
                    </td>
                </tr>`;
            return;
          }

          tbody.innerHTML = users
            .map((user) => {
              const online = user.status === "Online";

              const lastSeen = user.lastSeen ? new Date(user.lastSeen).toLocaleString() : "-";

              const mapsButton = user.mapsUrl
                ? `<a href="${escapeHtml(user.mapsUrl)}"
                     target="_blank"
                     class="btn btn-sm btn-outline-primary">See Location</a>`
                : `<span class="text-secondary">No location</span>`;

              return `
                <tr>
                    <td>${escapeHtml(user.userId || "")}</td>
                    <td class="fw-semibold">${escapeHtml(user.name || "")}</td>
                    <td>
                        <span class="${online ? "status-online" : "status-offline"}">
                            ${online ? "● Online" : "● Offline"}
                        </span>
                    </td>
                    <td>${escapeHtml(lastSeen)}</td>
                    <td>${mapsButton}</td>
                </tr>`;
            })
            .join("");
        } catch (error) {
          tbody.innerHTML = `
            <tr>
                <td colspan="5" class="text-center text-danger">
                    ${escapeHtml(error.message)}
                </td>
            </tr>`;
        }
      }

      // HTML escape
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          }[char];
        });
      }

      // Copy link
      async function copyLink() {
        if (!latestLink) return;

        try {
          await navigator.clipboard.writeText(latestLink);
          alert("Tracking link copied!");
        } catch (error) {
          alert("Copy failed. Please copy the link manually.");
        }
      }

      // WhatsApp share
      function shareWhatsApp() {
        if (!latestLink) return;

        const message = "Please open this link and allow location sharing:\n" + latestLink;

        window.open("https://wa.me/?text=" + encodeURIComponent(message), "_blank");
      }

      // Initial load
      loadUsers();
    </script>
  </body>
</html>
